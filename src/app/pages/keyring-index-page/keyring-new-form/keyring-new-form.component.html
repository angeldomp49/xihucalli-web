<div class="modal-background" (click)="onBackgroundClick($event)">
  <div class="modal-content">
    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <h2>Add a new keyring</h2>
      <button type="button" class="close-btn" (click)="onClose()">&times;</button>
      <div class="form-group">
        <label for="title">Title</label>
        <input id="title" name="title" [(ngModel)]="title" required />
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" [(ngModel)]="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required />
      </div>
      <div class="form-group">
        <label for="passwordConfirmation">Password Confirmation</label>
        <input id="passwordConfirmation" name="passwordConfirmation" type="password" [(ngModel)]="passwordConfirmation" required />
      </div>
      <div class="form-group">
        <label for="url">Url</label>
        <input id="url" name="url" [(ngModel)]="url" />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" [(ngModel)]="description"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
