<div (click)="onBackgroundClick($event)" class="modal-background">
  <div class="modal-content">
    <form (ngSubmit)="onSubmit()" autocomplete="off">
      <h2>Add a new keyring</h2>
      <button (click)="onClose()" class="close-btn" type="button">&times;</button>
      <div class="form-group">
        <label for="title">Title</label>
        <input [(ngModel)]="title" id="title" name="title" required/>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input [(ngModel)]="username" id="username" name="username" required/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input [(ngModel)]="password" id="password" name="password" required type="password"/>
      </div>
      <div class="form-group">
        <label for="passwordConfirmation">Password Confirmation</label>
        <input [(ngModel)]="passwordConfirmation" id="passwordConfirmation" name="passwordConfirmation" required
               type="password"/>
      </div>
      <div class="form-group">
        <label for="url">Url</label>
        <input [(ngModel)]="url" id="url" name="url"/>
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea [(ngModel)]="description" id="description" name="description"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</div>
