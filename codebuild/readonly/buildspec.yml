version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18.x
    commands:
      - echo "Installing dependencies"
      - npm install
  build:
    commands:
      - echo "Running tests and type checks"
      - npm run build:dev --if-present
  post_build:
    commands:
      - echo "Build completed on `date`"

artifacts:
  base-directory: 'dist/xihucalli_web/browser'
  files:
    - '**/*'
